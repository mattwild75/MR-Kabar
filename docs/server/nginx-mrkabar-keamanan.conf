# Disisipkan ke blok server 443 situs mrkabar (include /etc/nginx/snippets/mrkabar-keamanan.conf).
# Header keamanan + cache aset statis. Tidak menyentuh aplikasi.

# HSTS: peramban wajib HTTPS selama 1 tahun (sertifikat Let's Encrypt diperbarui certbot).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Larang situs lain membingkai halaman ini (clickjacking) dan menebak tipe berkas.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# CSP yang aman untuk Inertia/Vite: tidak membatasi skrip (bundel sudah dari domain sendiri),
# tetapi menutup pembingkaian, plugin, dan pengalihan <base>.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Aset hasil build Vite bernama hash: aman di-cache setahun.
location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}
location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}
