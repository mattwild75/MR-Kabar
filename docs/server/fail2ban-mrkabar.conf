# /etc/fail2ban/jail.d/mrkabar.conf
# SSH: 5 kali gagal dalam 10 menit -> blokir 1 jam.
[sshd]
enabled = true
maxretry = 5
findtime = 10m
bantime = 1h

# Percobaan masuk aplikasi: aplikasi sudah membatasi (429) per akun+IP;
# jail ini menutup IP yang terus menembak /login sampai 30x dalam 10 menit.
[mrkabar-login]
enabled = true
port = http,https
filter = mrkabar-login
logpath = /var/log/nginx/access.log
maxretry = 30
findtime = 10m
bantime = 2h
