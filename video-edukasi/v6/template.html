<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>MR Kabar — Berlayar dengan Peta Risiko</title>
<style>
@font-face { font-family: "Bebas"; src: url("fonts/BebasNeue-Regular.ttf"); }
@font-face { font-family: "Jakarta"; src: url("fonts/PlusJakartaSans[wght].ttf"); font-weight: 200 800; }
@font-face { font-family: "Playfair"; src: url("fonts/PlayfairDisplay-Italic[wght].ttf"); font-style: italic; font-weight: 400 900; }
@font-face { font-family: "Mono"; src: url("fonts/JetBrainsMono[wght].ttf"); font-weight: 100 800; }

:root {
  --malam: #06121f;
  --laut: #0b2a3f;
  --emas: #f2b45a;
  --emas2: #ffd68a;
  --merah: #e5484d;
  --kertas: #efe6d2;
  --putih: #f4f1ea;
  --redup: rgba(244, 241, 234, 0.66);
  --garis: rgba(244, 241, 234, 0.22);
  --st: #ef4444; --t: #fb923c; --s: #fde047; --r: #4ade80; --sr: #38bdf8;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#stage { position: absolute; inset: 0; overflow: hidden; font-family: "Jakarta", sans-serif; color: var(--putih); }
canvas#dunia { position: absolute; inset: 0; }
.lapis { position: absolute; inset: 0; pointer-events: none; }
#vinyet { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 72% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
canvas#grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.07; mix-blend-mode: overlay; }
.it { position: absolute; display: none; transform-origin: 50% 50%; z-index: 2; }
.it.lembar { z-index: 1; }

/* ── tipografi ─────────────────────────────────────────────── */
.hero { font-family: "Bebas"; font-size: 230px; line-height: 0.86; letter-spacing: 0.01em; text-shadow: 0 8px 40px rgba(0,0,0,.55); }
.h1 { font-family: "Bebas"; font-size: 150px; line-height: 0.9; letter-spacing: 0.01em; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.h2 { font-family: "Bebas"; font-size: 104px; line-height: 0.92; letter-spacing: 0.015em; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
.h3 { font-family: "Bebas"; font-size: 70px; line-height: 0.95; letter-spacing: 0.02em; text-shadow: 0 3px 18px rgba(0,0,0,.5); }
.h4 { font-family: "Bebas"; font-size: 50px; line-height: 1; letter-spacing: 0.03em; }
.serif { font-family: "Playfair"; font-style: italic; font-weight: 500; font-size: 54px; line-height: 1.22; text-shadow: 0 3px 20px rgba(0,0,0,.6); }
.serif-s { font-family: "Playfair"; font-style: italic; font-weight: 500; font-size: 38px; line-height: 1.3; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
.body { font-size: 34px; line-height: 1.38; font-weight: 500; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
.body-s { font-size: 27px; line-height: 1.4; font-weight: 500; color: var(--redup); text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.kicker { font-size: 24px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: var(--emas); }
.kicker::before { content: ""; display: inline-block; width: 46px; height: 4px; background: var(--merah); vertical-align: middle; margin-right: 18px; transform: translateY(-3px); }
.label { font-size: 22px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--redup); }
.mono { font-family: "Mono"; }
.emas { color: var(--emas); }
.merah { color: var(--merah); }
.redup { color: var(--redup); }
.kertas-t { color: #2a2118; text-shadow: none; }
em { font-style: normal; color: var(--emas); }
.coret { position: relative; }
.ctr { text-align: center; }
.kanan { text-align: right; }

/* cap di pojok kanan atas, seperti cap tahun di film dokumenter */
.cap { font-family: "Mono"; font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--putih); padding: 9px 16px; border: 1.5px solid rgba(244,241,234,.45); background: rgba(6,18,31,.35); white-space: nowrap; }
.cap b { color: var(--emas); font-weight: 700; }

/* stempel */
.stempel { font-family: "Bebas"; font-size: 96px; letter-spacing: 0.05em; color: var(--merah); border: 7px solid var(--merah);
  padding: 4px 26px 0; border-radius: 10px; background: rgba(229,72,77,.06); text-shadow: none; white-space: nowrap; }
.stempel.emas { color: var(--emas); border-color: var(--emas); background: rgba(242,180,90,.06); }

/* garis bawah sorot */
.garisbawah { height: 6px; background: var(--merah); transform-origin: 0 50%; }

/* foto */
.foto { overflow: hidden; }
.foto img { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
.foto .gelap { position: absolute; inset: 0; }
.print { background: #f3ead6; padding: 22px 22px 70px; box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.4); }
.print .ruang { position: relative; overflow: hidden; width: 100%; height: 100%; }
.print .ket { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: "Playfair"; font-style: italic; font-size: 26px; color: #3b2f22; }

/* perangkat */
.laptop { perspective: 2600px; }
.laptop .badan { position: absolute; inset: 0; transform-style: preserve-3d; }
.laptop .layar { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #0b0f14; border-radius: 22px; padding: 18px 18px 18px; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08) inset; }
.laptop .kaca { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; background: #fff; }
.laptop .kaca img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
.laptop .alas { position: absolute; left: -6%; right: -6%; bottom: -34px; height: 34px; background: linear-gradient(#c9ccd1, #8d9198); border-radius: 0 0 26px 26px; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
.laptop .fokus { position: absolute; border: 5px solid var(--emas); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(6,18,31,.55), 0 0 40px rgba(242,180,90,.7); }
.laptop .kursor { position: absolute; width: 34px; height: 34px; }

/* matriks */
.mtx { font-family: "Bebas"; }
.mtx .sel { position: absolute; display: flex; align-items: center; justify-content: center; color: #111; font-size: 52px; border-radius: 8px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
.mtx .sumbu { position: absolute; font-family: "Jakarta"; font-weight: 800; font-size: 22px; letter-spacing: .22em; text-transform: uppercase; color: var(--redup); }
.mtx .angka { position: absolute; font-size: 34px; color: var(--redup); width: 40px; text-align: center; }
.mtx .selera { position: absolute; border: 0 dashed var(--putih); }

/* kartu bab */
.kartu { inset: 0; }
.kartu .no { position: absolute; left: 150px; top: 250px; font-family: "Bebas"; font-size: 380px; line-height: .8; color: transparent; -webkit-text-stroke: 3px rgba(242,180,90,.85); }
.kartu .babak { position: absolute; left: 160px; top: 200px; }
.kartu .judul { position: absolute; left: 156px; top: 600px; width: 1500px; font-family: "Bebas"; font-size: 150px; line-height: .9; }
.kartu .garis { position: absolute; left: 160px; top: 760px; height: 6px; width: 420px; background: var(--merah); transform-origin: 0 50%; }
.kartu .sub { position: absolute; left: 160px; top: 790px; width: 1300px; }

/* kertas Excel beterbangan */
.lembar { position: absolute; width: 240px; height: 300px; background: #f7f7f2; border-radius: 4px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
  background-image: linear-gradient(#cfd8cf 1.5px, transparent 1.5px), linear-gradient(90deg, #cfd8cf 1.5px, transparent 1.5px); background-size: 48px 20px; }
.lembar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 24px; background: #1f7a45; border-radius: 4px 4px 0 0; }
.lembar.word::before { background: #2b5797; }
.lembar.word { background-image: repeating-linear-gradient(#f7f7f2 0 16px, #c7ccd6 16px 18px); background-size: auto; }

/* kredit */
.kredit { left: 360px; width: 1200px; text-align: center; }
.kredit h5 { font-family: "Jakarta"; font-weight: 800; font-size: 22px; letter-spacing: .3em; text-transform: uppercase; color: var(--emas); margin: 54px 0 14px; }
.kredit p { margin: 0 0 8px; font-size: 25px; line-height: 1.4; color: var(--putih); }
.kredit p small { color: var(--redup); font-size: 20px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="dunia" width="1920" height="1080"></canvas>
  <div id="foto" class="lapis"></div>
  <div id="ui" class="lapis"></div>
  <div id="vinyet"></div>
  <canvas id="grain" width="960" height="540"></canvas>
</div>
<script>window.TL = __TIMELINE__; window.KREDIT = __KREDIT__;</script>
<script>
__ENGINE__
</script>
<script>
__SCENES__
</script>
</body>
</html>
