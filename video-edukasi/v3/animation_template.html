<meta charset="utf-8">
<title>MR Kabar — Video Edukasi v2</title>
<style>
/* ── Semua gerak adalah FUNGSI MURNI dari t (lihat setVideoTime).
   Tidak ada transition/animation CSS sama sekali: renderer memanggil
   setVideoTime(t) per-frame lalu memotret, jadi apa pun yang bergantung
   pada wall-clock akan menghasilkan video yang tersendat. ── */
:root{
  --bg0:#061a1f; --bg1:#0c2f38; --bg2:#123f4a;
  --ink:#eaf6f8; --muted:#9dc0c8; --line:rgba(255,255,255,.14);
  --risk:#ef4444; --sys:#38bdf8; --ok:#4ade80; --warn:#fbbf24;
  /* dua warna ini HARUS sama persis dgn pita warna RiskMatrixCell
     (>=16 oranye "Tinggi", >=11 kuning "Moderat") supaya legenda di scene
     matriks tidak berbeda dari sel yang diterangkannya */
  --orange:#fb923c; --yellow:#fde047;
  --gold:#f5c04a; --neutral:#94a3b8; --violet:#a78bfa;
  --ac:#f5c04a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg0)}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased}

#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:-8%;background:
      radial-gradient(1200px 800px at 22% 18%, var(--bg2) 0%, transparent 62%),
      radial-gradient(1000px 700px at 82% 82%, #17505e 0%, transparent 60%),
      linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 100%)}
/* dipromosikan ke layer sendiri: #grid digeser tiap frame, #vig statis di
   atas segalanya -- tanpa ini keduanya ikut di-raster ulang setiap frame */
#grid{position:absolute;inset:-10%;opacity:.16;will-change:transform;
      background-image:linear-gradient(var(--line) 1px,transparent 1px),
                       linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:78px 78px}
#fx{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#vig{position:absolute;inset:0;pointer-events:none;transform:translateZ(0);
     background:radial-gradient(circle at 50% 46%,transparent 52%,rgba(0,0,0,.55) 100%)}

.scene{position:absolute;inset:0}

/* progress + label bab */
#bar{position:absolute;left:0;top:0;height:5px;background:var(--gold);
     box-shadow:0 0 16px rgba(245,192,74,.7);width:0}
#chip-chapter{position:absolute;left:56px;top:34px;display:flex;align-items:center;gap:14px}
#chip-chapter .n{width:44px;height:44px;border-radius:12px;background:var(--gold);
     color:#08252c;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
#chip-chapter .t{font-size:23px;font-weight:600;letter-spacing:.06em;
     text-transform:uppercase;color:var(--muted)}
#brandmark{position:absolute;right:52px;top:34px;font-size:22px;font-weight:700;
     letter-spacing:.16em;color:rgba(234,246,248,.42)}

/* ── item dasar ── */
/* width:max-content -- tanpa ini elemen absolut menyusut ke ruang sisa di
   kanannya, sehingga judul panjang terpotong jadi dua baris di posisi yang
   tak terduga. Pemenggalan baris HANYA boleh terjadi lewat \n eksplisit. */
.it{position:absolute;transform-origin:50% 50%;will-change:transform,opacity;
    width:max-content;max-width:1820px}
.ic{display:block}
.ic svg{width:100%;height:100%;display:block}
.acf{fill:var(--ac)}
.ac{fill:var(--ac)}

.c-risk{color:var(--risk);--ac:#fca5a5}
.c-sys{color:var(--sys);--ac:#bae6fd}
.c-ok{color:var(--ok);--ac:#bbf7d0}
.c-warn{color:var(--warn);--ac:#fde68a}
.c-gold{color:var(--gold);--ac:#ffe6a8}
.c-neutral{color:var(--neutral);--ac:#e2e8f0}
.c-violet{color:var(--violet);--ac:#ddd6fe}
.c-orange{color:var(--orange);--ac:#fed7aa}
.c-yellow{color:var(--yellow);--ac:#fef9c3}
.c-ink{color:var(--ink);--ac:#f5c04a}

.t-title{font-size:104px;font-weight:800;letter-spacing:-.02em;line-height:1.02;
         text-align:center;white-space:pre-line;text-shadow:0 8px 40px rgba(0,0,0,.45)}
.t-h1{font-size:76px;font-weight:800;letter-spacing:-.015em;text-align:center;white-space:pre-line}
.t-h2{font-size:54px;font-weight:700;text-align:center;white-space:pre-line;line-height:1.18}
.t-sub{font-size:38px;font-weight:500;color:var(--muted);text-align:center;
       white-space:pre-line;line-height:1.32}
.t-lbl{font-size:27px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
       text-align:center;color:var(--muted)}
.t-cap{font-size:29px;font-weight:600;text-align:center;line-height:1.24;white-space:pre-line}
.t-quote{font-size:44px;font-weight:600;line-height:1.34;text-align:center;white-space:pre-line}
.t-mono{font-family:"Cascadia Mono",Consolas,monospace;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;
      background:rgba(255,255,255,.07);border:2px solid currentColor;
      font-size:30px;font-weight:700;white-space:nowrap}
.chip .dot{width:15px;height:15px;border-radius:50%;background:currentColor;flex:none}

.card{display:flex;flex-direction:column;align-items:center;gap:16px;
      padding:26px 22px;border-radius:26px;background:rgba(255,255,255,.055);
      border:2px solid rgba(255,255,255,.12)}
.card .cap{font-size:27px;font-weight:700;text-align:center;line-height:1.2;color:var(--ink)}
.card .sm{font-size:22px;font-weight:500;color:var(--muted);text-align:center;line-height:1.2}

.box{border-radius:24px;border:3px solid currentColor;background:rgba(255,255,255,.05);
     display:flex;flex-direction:column;justify-content:center;gap:12px;padding:26px 32px}
.box .bt{font-size:24px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.box .bb{font-size:34px;font-weight:600;color:var(--ink);line-height:1.22}

.num{font-size:150px;font-weight:800;line-height:1;letter-spacing:-.03em}

.step{width:74px;height:74px;border-radius:22px;display:flex;align-items:center;
      justify-content:center;font-size:38px;font-weight:800;background:currentColor}
.step span{color:#062028}

.mx{display:grid;grid-template-columns:repeat(5,var(--cw));grid-auto-rows:var(--cw);gap:9px}
.mx .cell{border-radius:12px;display:flex;align-items:center;justify-content:center;
          font-size:32px;font-weight:800;color:#06222a}
.axl{font-size:26px;font-weight:700;color:var(--muted);letter-spacing:.06em}

.barv{width:100%;border-radius:12px 12px 4px 4px;background:currentColor;
      transform-origin:50% 100%}
.rule{background:currentColor;border-radius:99px;transform-origin:0% 50%}
.ring{border-radius:26px;border:5px solid var(--gold);box-shadow:0 0 34px rgba(245,192,74,.55)}

.stack{display:flex;align-items:center;gap:var(--g,26px)}
.stack.col{flex-direction:column}

/* Bingkai jendela peramban untuk tangkapan layar aplikasi sungguhan.
   Ditampilkan sebagai jendela, bukan gambar telanjang, supaya penonton
   langsung paham "ini layar aplikasi", bukan ilustrasi. */
.win{border-radius:16px;overflow:hidden;background:#0b2027;
     border:2px solid rgba(255,255,255,.22);
     box-shadow:0 26px 70px rgba(0,0,0,.55)}
.win .bar{height:34px;background:#12313b;display:flex;align-items:center;gap:9px;
          padding:0 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.win .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.3)}
.win .url{margin-left:10px;font-size:16px;color:#8fb3bf;letter-spacing:.02em}
.win img{display:block;width:100%;height:auto}
.win .crop{overflow:hidden}

/* Strip ringkasan di akhir tiap bab besar */
.recap{display:flex;gap:14px;align-items:center;padding:14px 26px;border-radius:999px;
       background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16)}
.recap .lbl{font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
            color:var(--gold)}
.recap .txt{font-size:26px;font-weight:600;color:var(--ink);white-space:nowrap}
</style>

<style>
/* Dasar hukum ditempel permanen di layar, bukan hanya disebut di narasi —
   penonton yang menonton potongan mana pun tetap tahu acuannya. */
/* Diletakkan di bawah brandmark (kanan ATAS), bukan di bawah layar:
   zona bawah sudah dipesan untuk subtitle burn-in, dan subtitle tiga baris
   bisa turun cukup jauh. */
#legal{position:absolute;right:52px;top:72px;font-size:18px;letter-spacing:.05em;
       color:rgba(234,246,248,.32);text-align:right}

<!--SYMBOLS-->

<script>
const SCENES_TIME = /*SCENEMAP*/;
const TOTAL = /*TOTAL*/;
/* Offset tiap kalimat narasi RELATIF terhadap awal scene-nya, disuntik dari
   timeline.json. Spesifikasi scene memakai L(idKalimat, offset) alih-alih
   detik absolut, jadi kalau durasi TTS berubah, seluruh koreografi ikut
   bergeser sendiri dan tidak pernah bisa lepas sinkron dari narasi. */
const LINE_OFF = /*LINEOFF*/;
const L=(id,off)=>(LINE_OFF[id]||0)+(off||0);
/*SCENES*/
const SPEC_BY_ID = Object.fromEntries(SCENE_SPECS.map(s=>[s.id,s]));

/* ══════════════ util ══════════════ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,p)=>a+(b-a)*p;
const easeOut=p=>1-Math.pow(1-p,3);
const easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};

/* ══════════════ data matriks 5x5 (SALINAN PERSIS RiskMatrixCell) ══════════════
   Ini BUKAN dampak x kemungkinan -- ini tabel peringkat 1..25 yang sengaja
   memberi bobot lebih besar pada dampak (d5k1=20 vs d1k5=9). Nilainya disalin
   dari database supaya video tidak pernah mengajarkan angka yang berbeda dari
   yang dilihat pengguna di /keterangan-pendukung. */
const MX = {
  1:{1:1, 2:2, 3:4, 4:6, 5:9},
  2:{1:3, 2:7, 3:10,4:12,5:15},
  3:{1:5, 2:11,3:14,4:16,5:18},
  4:{1:8, 2:13,3:17,4:19,5:23},
  5:{1:20,2:21,3:22,4:24,5:25},
};
const mxColor=v=>v>=20?'#ef4444':v>=16?'#fb923c':v>=11?'#fde047':v>=6?'#4ade80':'#38bdf8';

/* ══════════════ pembangun elemen ══════════════ */
function E(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html;return e;}
function svgIcon(sym,size,cls){
  const w=E('div','ic '+(cls||''));w.style.width=size+'px';w.style.height=size+'px';
  w.innerHTML='<svg viewBox="0 0 100 100"><use href="#i-'+sym+'"/></svg>';return w;}

const BUILD = {
  icon:s=>svgIcon(s.sym,s.s||140,s.c?('c-'+s.c):''),

  card:s=>{const c=E('div','card '+(s.c?'c-'+s.c:''));c.style.width=(s.w||230)+'px';
    c.appendChild(svgIcon(s.sym,s.s||104));
    c.appendChild(E('div','cap',s.cap));
    if(s.sm)c.appendChild(E('div','sm',s.sm));return c;},

  title:s=>E('div','t-title '+(s.c?'c-'+s.c:''),s.text),
  h1:s=>E('div','t-h1 '+(s.c?'c-'+s.c:''),s.text),
  h2:s=>E('div','t-h2 '+(s.c?'c-'+s.c:''),s.text),
  sub:s=>E('div','t-sub',s.text),
  lbl:s=>E('div','t-lbl '+(s.c?'c-'+s.c:''),s.text),
  cap:s=>E('div','t-cap '+(s.c?'c-'+s.c:''),s.text),
  quote:s=>{const q=E('div','t-quote '+(s.c?'c-'+s.c:''),s.text);
    q.style.width=(s.w||1320)+'px';return q;},

  chip:s=>{const c=E('div','chip '+(s.c?'c-'+s.c:'c-neutral'));
    if(s.dot!==false)c.appendChild(E('div','dot'));
    c.appendChild(E('span',null,s.text));
    if(s.size)c.style.fontSize=s.size+'px';return c;},

  box:s=>{const b=E('div','box '+(s.c?'c-'+s.c:''));b.style.width=(s.w||460)+'px';
    if(s.h)b.style.height=s.h+'px';
    if(s.t)b.appendChild(E('div','bt',s.t));
    b.appendChild(E('div','bb',s.text));return b;},

  step:s=>{const w=E('div','stack '+(s.c?'c-'+s.c:'c-gold'));
    const n=E('div','step');n.appendChild(E('span',null,s.n));w.appendChild(n);
    if(s.text)w.appendChild(E('div','t-h2',s.text));return w;},

  num:s=>{const w=E('div','stack col c-'+(s.c||'gold'));w.style.setProperty('--g','6px');
    const n=E('div','num','0');w.appendChild(n);
    if(s.text)w.appendChild(E('div','t-lbl',s.text));
    w._num=n;w._to=s.to;return w;},

  rule:s=>{const r=E('div','rule '+(s.c?'c-'+s.c:'c-neutral'));
    r.style.width=(s.w||300)+'px';r.style.height=(s.h||5)+'px';return r;},

  bar:s=>{const w=E('div','stack col c-'+(s.c||'sys'));w.style.setProperty('--g','12px');
    const holder=E('div');holder.style.cssText='width:'+(s.w||86)+'px;height:'+(s.hMax||260)+'px;display:flex;align-items:flex-end';
    const b=E('div','barv');b.style.height=(s.h||120)+'px';holder.appendChild(b);
    w.appendChild(holder);
    if(s.text)w.appendChild(E('div','t-cap',s.text));
    w._bar=b;return w;},

  matrix:s=>{
    const wrap=E('div');wrap.style.cssText='display:flex;flex-direction:column;gap:14px;align-items:center';
    const row=E('div');row.style.cssText='display:flex;align-items:center;gap:16px';
    const ylab=E('div','axl','K\nE\nM\nU\nN\nG\nK\nI\nN\nA\nN'.split('\n').join('<br>'));
    ylab.style.cssText='writing-mode:horizontal-tb;text-align:center;line-height:1.02;font-size:19px';
    const g=E('div','mx');g.style.setProperty('--cw',(s.cw||118)+'px');
    for(let k=5;k>=1;k--)for(let d=1;d<=5;d++){
      const v=MX[d][k];const c=E('div','cell',String(v));
      c.style.background=mxColor(v);c.dataset.k=k;c.dataset.d=d;g.appendChild(c);}
    row.appendChild(ylab);row.appendChild(g);
    wrap.appendChild(row);
    wrap.appendChild(E('div','axl','DAMPAK  →'));
    wrap._cells=g.children;return wrap;},

  /* Tangkapan layar aplikasi sungguhan (berkas di shots/), dibingkai
     seperti jendela peramban. `crop` memotong tinggi gambar dari atas
     supaya bagian yang relevan saja yang tampil. */
  shot:s=>{
    const w=E('div','win');w.style.width=(s.w||1080)+'px';
    const bar=E('div','bar');
    bar.appendChild(E('div','dot'));bar.appendChild(E('div','dot'));bar.appendChild(E('div','dot'));
    bar.appendChild(E('div','url',s.url||'mrkabar.test'));
    w.appendChild(bar);
    const crop=E('div','crop');
    if(s.h)crop.style.height=s.h+'px';
    const img=E('img');img.src='shots/'+s.src+'.png';
    if(s.shift)img.style.marginTop=(-s.shift)+'px';
    crop.appendChild(img);w.appendChild(crop);
    return w;},

  /* Gambar apa adanya dari img/ — dipakai untuk lambang resmi Pemerintah
     Kabupaten Aceh Barat dan logo MR Kabar. Keduanya TIDAK digambar ulang
     sebagai ikon vektor; berkas aslinya yang dipasang. */
  img:s=>{const w=E('div');w.style.width=(s.w||300)+'px';
    const im=E('img');im.src='img/'+s.src+'.png';
    im.style.cssText='width:100%;height:auto;display:block';
    if(s.shadow)im.style.filter='drop-shadow(0 10px 30px rgba(0,0,0,.45))';
    // Logo MR Kabar bertuliskan teks HITAM. Di atas latar gelap video
    // tulisannya lenyap sama sekali, jadi logo dipasang di atas alas putih
    // — sesuai logo_bg #ffffff yang memang sudah disetel di aplikasi.
    if(s.plate){
      w.style.cssText+=';background:#fff;border-radius:28px;padding:'+(s.pad||26)+'px '+
        (s.padX||34)+'px;box-shadow:0 22px 60px rgba(0,0,0,.5)';
      w.style.width=(s.w||300)+'px';w.style.boxSizing='content-box';
    }
    w.appendChild(im);return w;},

  recap:s=>{const w=E('div','recap');
    w.appendChild(E('div','lbl',s.lbl||'RINGKASAN'));
    w.appendChild(E('div','txt',s.text));return w;},

  orbit:s=>{const w=E('div');w.style.cssText='width:1px;height:1px';
    w._orb=s.items.map((sym,i)=>{const el=svgIcon(sym,s.s||86,'c-'+(s.c||'neutral'));
      el.style.position='absolute';el.style.transformOrigin='50% 50%';w.appendChild(el);return el;});
    return w;},
};

/* ══════════════ efek masuk ══════════════ */
function transformFor(anim,p,s){
  const e=easeOut(p);
  switch(anim){
    case'pop':   return'scale('+lerp(.35,1,easeBack(p))+')';
    case'up':    return'translateY('+lerp(70,0,e)+'px)';
    case'down':  return'translateY('+lerp(-70,0,e)+'px)';
    case'left':  return'translateX('+lerp(-110,0,e)+'px)';
    case'right': return'translateX('+lerp(110,0,e)+'px)';
    case'zoom':  return'scale('+lerp(1.7,1,e)+')';
    case'shrink':return'scale('+lerp(.15,1,e)+')';
    case'flip':  return'perspective(1200px) rotateY('+lerp(92,0,e)+'deg)';
    case'tilt':  return'perspective(1200px) rotateX('+lerp(-70,0,e)+'deg)';
    case'grow':  return'scaleX('+e+')';
    case'rise':  return'translateY('+lerp(120,0,e)+'px) scale('+lerp(.8,1,e)+')';
    default:     return'';
  }
}
function idleFor(idle,t,ph){
  if(!idle)return'';
  switch(idle){
    case'float': return' translateY('+(Math.sin(t*1.25+ph)*7).toFixed(2)+'px)';
    case'bob':   return' translateY('+(Math.sin(t*2.1+ph)*4).toFixed(2)+'px)';
    case'pulse': return' scale('+(1+.028*Math.sin(t*2.4+ph)).toFixed(4)+')';
    case'spin':  return' rotate('+((t*22)%360).toFixed(2)+'deg)';
    case'sway':  return' rotate('+(Math.sin(t*1.1+ph)*2.2).toFixed(2)+'deg)';
    default:     return'';
  }
}

/* ══════════════ perakitan scene ══════════════ */
const cam=document.getElementById('cam');
const sceneEls={};
SCENE_SPECS.forEach(spec=>{
  const el=E('div','scene');el.id=spec.id;el.style.opacity=0;
  spec.items.forEach((s,idx)=>{
    const node=BUILD[s.k](s);
    const wrap=E('div','it');
    wrap.style.left=s.x+'px';wrap.style.top=s.y+'px';
    wrap.appendChild(node);
    wrap._s=s;wrap._inner=node;wrap._ph=(idx*0.9)%6.28;
    if(s.k==='matrix')wrap._cells=node._cells;
    if(s.k==='num'){wrap._num=node._num;wrap._to=node._to;}
    if(s.k==='bar')wrap._bar=node._bar;
    if(s.k==='orbit')wrap._orb=node._orb;
    el.appendChild(wrap);
  });
  cam.appendChild(el);
  sceneEls[spec.id]=el;
});
/* geser semua item ke titik tengahnya sendiri (x,y = PUSAT elemen) */
document.querySelectorAll('.it').forEach(el=>{el.style.marginLeft='0';});

/* ══════════════ partikel latar ══════════════ */
const fx=document.getElementById('fx').getContext('2d');
const PT=[];for(let i=0;i<55;i++)PT.push({x:Math.random()*1920,y:Math.random()*1080,
  r:Math.random()*2.6+.7,sp:Math.random()*13+4,ph:Math.random()*6.28,a:Math.random()*.3+.08});
function drawFx(t){
  fx.clearRect(0,0,1920,1080);
  for(const p of PT){
    const y=(p.y-t*p.sp)%1080,yy=y<0?y+1080:y;
    const x=p.x+Math.sin(t*.45+p.ph)*22;
    fx.beginPath();fx.arc(x,yy,p.r,0,6.283);
    fx.fillStyle='rgba(180,230,240,'+(p.a*(.6+.4*Math.sin(t*.9+p.ph))).toFixed(3)+')';
    fx.fill();
  }
}

/* ══════════════ pengendali waktu ══════════════ */
const chapEl=document.getElementById('chip-chapter');
const chapN=chapEl.querySelector('.n'),chapT=chapEl.querySelector('.t');
const barEl=document.getElementById('bar');
const gridEl=document.getElementById('grid');
const bgEl=document.getElementById('bg');

function camFor(spec,lt){
  const kf=spec.cam;if(!kf||!kf.length)return{s:1,x:0,y:0};
  if(lt<=kf[0].t)return kf[0];
  for(let i=0;i<kf.length-1;i++){
    if(lt>=kf[i].t&&lt<=kf[i+1].t){
      const p=easeInOut((lt-kf[i].t)/(kf[i+1].t-kf[i].t));
      return{s:lerp(kf[i].s??1,kf[i+1].s??1,p),
             x:lerp(kf[i].x??0,kf[i+1].x??0,p),
             y:lerp(kf[i].y??0,kf[i+1].y??0,p)};
    }
  }
  return kf[kf.length-1];
}

window.setVideoTime=function(t){
  drawFx(t);
  barEl.style.width=(clamp(t/TOTAL,0,1)*1920).toFixed(1)+'px';
  gridEl.style.transform='translate('+(-(t*7)%78).toFixed(2)+'px,'+(-(t*4)%78).toFixed(2)+'px)';
  // #bg SENGAJA tidak dianimasikan. Men-scale/rotate satu lapisan 1920x1080
  // berisi tiga radial-gradient memaksa raster ulang penuh tiap frame, dan
  // itu sendirian membuat render 31 ribu frame jadi berjam-jam. Gerak latar
  // sudah cukup diwakili parallax grid + partikel yang jauh lebih murah.

  let active=null;
  for(const st of SCENES_TIME){ if(t>=st.start&&t<st.end){active=st;break;} }
  if(!active){ // di luar semua scene: pakai yang terdekat sebelumnya
    for(const st of SCENES_TIME) if(t>=st.start) active=st;
  }

  for(const st of SCENES_TIME){
    const el=sceneEls[st.id];if(!el)continue;
    if(st!==active){el.style.opacity=0;el.style.display='none';continue;}
    el.style.display='block';
    const lt=t-st.start;
    const fin=clamp(lt/0.55,0,1);
    const fout=1-clamp((t-(st.end-0.55))/0.55,0,1);
    el.style.opacity=(fin*fout).toFixed(3);

    const spec=SPEC_BY_ID[st.id];
    const c=camFor(spec,lt);
    cam.style.transform='scale('+c.s.toFixed(4)+') translate('+c.x+'px,'+c.y+'px)';

    chapN.textContent=spec.chap||'';
    chapT.textContent=spec.title||'';
    chapEl.style.opacity=spec.chap?clamp(lt/0.8,0,1)*fout:0;

    for(const w of el.children){
      const s=w._s,at=s.at||0,dur=s.dur||0.7;
      if(lt<at-0.001){w.style.opacity=0;continue;}
      const p=clamp((lt-at)/dur,0,1);
      let op=easeOut(clamp((lt-at)/(dur*0.72),0,1));
      if(s.out!=null)op*=1-clamp((lt-s.out)/0.45,0,1);
      w.style.opacity=op.toFixed(3);
      w.style.transform='translate(-50%,-50%) '+transformFor(s.a||'fade',p,s)+idleFor(s.idle,lt,w._ph);

      if(w._num){const v=Math.round(lerp(0,w._to,easeOut(clamp((lt-at)/(s.dur||1.5),0,1))));
        w._num.textContent=v;}
      if(w._bar){w._bar.style.transform='scaleY('+easeOut(p)+')';}
      if(w._orb){
        const n=w._orb.length,R=s.r||300,RY=s.ry||(R*.42),sp=s.sp||0.19;
        w._orb.forEach((o,i)=>{
          const ang=t*sp+(i/n)*6.2832;
          const ox=Math.cos(ang)*R,oy=Math.sin(ang)*RY;
          const dep=(Math.sin(ang)+1)/2;
          o.style.transform='translate(-50%,-50%) translate('+ox.toFixed(1)+'px,'+oy.toFixed(1)+'px) scale('+(0.72+dep*0.42).toFixed(3)+')';
          o.style.opacity=(clamp((lt-at-i*0.12)/0.6,0,1)*(0.5+dep*0.5)).toFixed(3);
        });
      }
      if(w._cells){
        const st0=s.at||0,stag=s.stagger||0.055;
        [...w._cells].forEach((cell,i)=>{
          const cp=clamp((lt-st0-i*stag)/0.42,0,1);
          cell.style.opacity=cp.toFixed(3);
          cell.style.transform='scale('+lerp(.5,1,easeBack(cp))+')';
        });
        if(s.hi){
          [...w._cells].forEach(cell=>{
            const on=s.hi.some(h=>+cell.dataset.d===h[0]&&+cell.dataset.k===h[1]);
            const hp=clamp((lt-(s.hiAt||0))/0.5,0,1);
            cell.style.boxShadow=on&&hp>0?'0 0 0 '+(6*hp).toFixed(1)+'px #fff, 0 0 34px rgba(255,255,255,.8)':'none';
            if(on)cell.style.transform='scale('+(1+0.1*hp)+')';
          });
        }
      }
    }
  }
};
window.setVideoTime(0);
</script>
